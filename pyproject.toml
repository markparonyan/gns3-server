[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gns3-server"
description = "GNS3 graphical interface for the GNS3 server."
license-files = ["LICENSE"]
authors = [
  { name = "Jeremy Grossmann", email = "developers@gns3.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Environment :: Console",
        "Framework :: FastAPI",
        "Intended Audience :: Information Technology",
        "Topic :: System :: Networking",
        "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
        "Natural Language :: English",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: Implementation :: CPython"
]

dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
version = {attr = "gns3server.version.__version__"}
dependencies = {file = "requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
# Development dependencies
dev = {file = ['dev-requirements.txt']}

# AI features bundle — installs both AI Copilot and MCP dependencies
ai-features = {file = ['ai-requirements.txt', 'mcp-requirements.txt']}
# terraform = {file = ['terraform-requirements.txt']}  # Future component

[project.urls]
"Homepage" = "http://gns3.com"
"Repository" = "http://github.com/GNS3/gns3-server"
"Bug tracker" = "http://github.com/GNS3/gns3-server/issues"

[project.scripts]
gns3server = "gns3server.main:main"
gns3vmnet = "gns3server.utils.vmnet:main"
gns3server-web-wireshark-setup = "gns3server.agent.web_wireshark.setup_wireshark_image:main"
gns3server-uninstall-ai-features = "gns3server.utils.uninstall_ai_features:main"

[tool.setuptools]
packages = ["gns3server"]


[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "*.md",
]

[tool.ruff.lint]
select = [
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C90",   # mccabe
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "LOG",   # flake8-logging
  "PLE",   # pylint errors
  "PLW",   # pylint warnings
  "RUF",   # ruff-specific rules
  "S",     # flake8-bandit
  "T10",   # flake8-debugger
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as defaults:
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
  "gns3server.api.routes.controller.dependencies.database.get_repository",
  "gns3server.api.routes.controller.dependencies.rbac.has_privilege",
  "gns3server.api.routes.controller.dependencies.rbac.has_privilege_on_websocket",
]

[tool.ruff.lint.per-file-ignores]
# pytest rewrites bare asserts; S101 is a false positive in test suites.
"tests/**" = ["S101"]
"gns3server/compute/dynamips/nodes/router.py" = ["F522"]
"gns3server/controller/node_types.py" = ["W292"]
"gns3server/schemas/controller/templates/docker_templates.py" = ["W292"]
"gns3server/services/templates.py" = ["W292"]
"gns3server/utils/packet_filter_validation.py" = ["W292"]
"tests/api/routes/controller/test_images.py" = ["W292"]
"tests/api/routes/controller/test_links.py" = ["W292"]
"tests/utils/test_packet_filter_validation.py" = ["W292"]

[tool.mypy]
files = ["gns3server"]
plugins = ["pydantic.mypy"]
# Third-party packages without type hints / stubs:
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

