[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gns3-server"
description = "GNS3 graphical interface for the GNS3 server."
license-files = ["LICENSE"]
authors = [
  { name = "Jeremy Grossmann", email = "developers@gns3.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Environment :: Console",
        "Framework :: FastAPI",
        "Intended Audience :: Information Technology",
        "Topic :: System :: Networking",
        "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
        "Natural Language :: English",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: Implementation :: CPython"
]

dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
version = {attr = "gns3server.version.__version__"}
dependencies = {file = "requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
# Development dependencies
dev = {file = ['dev-requirements.txt']}

# AI features bundle — installs both AI Copilot and MCP dependencies
ai-features = {file = ['ai-requirements.txt', 'mcp-requirements.txt']}
# terraform = {file = ['terraform-requirements.txt']}  # Future component

[project.urls]
"Homepage" = "http://gns3.com"
"Repository" = "http://github.com/GNS3/gns3-server"
"Bug tracker" = "http://github.com/GNS3/gns3-server/issues"

[project.scripts]
gns3server = "gns3server.main:main"
gns3vmnet = "gns3server.utils.vmnet:main"
gns3server-web-wireshark-setup = "gns3server.agent.web_wireshark.setup_wireshark_image:main"
gns3server-uninstall-ai-features = "gns3server.utils.uninstall_ai_features:main"

[tool.setuptools]
packages = ["gns3server"]


[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "*.md",
]

[tool.ruff.lint]
select = [
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C90",   # mccabe
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "LOG",   # flake8-logging
  "PLE",   # pylint errors
  "PLW",   # pylint warnings
  "RUF",   # ruff-specific rules
  "S",     # flake8-bandit
  "T10",   # flake8-debugger
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
# Baseline: widespread rules that the existing code still violates
# (violation count at baseline time). Remove an entry, and fix its
# violations, in a dedicated small PR. Never add new entries here:
# fix the code or use a targeted "# noqa: CODE" with a reason.
ignore = [
  "B007",      #   32  unused-loop-control-variable
  "E402",      #  129  module-import-not-at-top-of-file
  "E501",      #  655  line-too-long
  "F841",      #   32  unused-variable
  "PLW2901",   #   30  redefined-loop-name
  "RUF012",    #   23  mutable-class-default
  "RUF036",    #   22  none-not-at-end-of-union
  "RUF059",    #   29  unused-unpacked-variable
  "S101",      #   19  assert
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as defaults:
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
  "gns3server.api.routes.controller.dependencies.database.get_repository",
  "gns3server.api.routes.controller.dependencies.rbac.has_privilege",
  "gns3server.api.routes.controller.dependencies.rbac.has_privilege_on_websocket",
]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and hardcoded credentials / temp paths:
"tests/**" = ["S101"]
# Baseline: existing violations of rules that are enforced everywhere else.
# Remove entries one small PR at a time. Never add new ones.
"gns3server/agent/gns3_copilot/utils/message_converters.py" = ["RUF019"]
"gns3server/agent/web_wireshark/stats.py" = ["ASYNC221"]
"gns3server/api/routes/controller/nodes.py" = ["RUF019"]
"gns3server/compute/base_node.py" = ["RUF019"]
"gns3server/compute/docker/docker_vm.py" = ["RUF006"]
"gns3server/compute/dynamips/nodes/router.py" = ["F522", "RUF006"]
"gns3server/compute/qemu/qemu_vm.py" = ["ASYNC220"]
"gns3server/controller/node_types.py" = ["W292"]
"gns3server/controller/ports/port_factory.py" = ["B020"]
"gns3server/controller/project.py" = ["ASYNC110", "RUF006", "RUF019"]
"gns3server/db/repositories/llm_model_configs.py" = ["RUF019"]
"gns3server/db/tasks.py" = ["RUF006", "RUF019"]
"gns3server/schemas/controller/templates/docker_templates.py" = ["W292"]
"gns3server/server.py" = ["RUF006"]
"gns3server/services/templates.py" = ["W292"]
"gns3server/utils/asyncio/__init__.py" = ["RUF006"]
"gns3server/utils/asyncio/telnet_server.py" = ["RUF006"]
"gns3server/utils/packet_filter_validation.py" = ["W292"]
"tests/api/routes/controller/test_images.py" = ["W292"]
"tests/api/routes/controller/test_links.py" = ["W292"]
"tests/compute/test_project.py" = ["RUF064"]
"tests/utils/test_packet_filter_validation.py" = ["W292"]
"tests/services/test_image_reconciliation.py" = ["S324"]

[tool.mypy]
files = ["gns3server"]
plugins = ["pydantic.mypy"]
# Third-party packages without type hints / stubs:
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

